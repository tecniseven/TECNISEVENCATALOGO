<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECNISEVEN - Catálogo en la Nube</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .neon-glow {
            box-shadow: 0 0 15px rgba(35, 35, 255, 0.4);
        }
        input:focus, select:focus {
            border-color: #2323ff !important;
            box-shadow: 0 0 10px rgba(35, 35, 255, 0.4);
            outline: none;
        }
        .input-precio-final {
            background-color: #0b0b1a !important;
            color: #ffffff !important;
            border: 2px solid #2323ff !important;
        }
    </style>

    <!-- Módulos de Firebase Realtime Database -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // TUS LLAVES REALES DE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyCYTZrTBFxhwr0Pz9v7oFXNQLKJJPsA7H4",
            authDomain: "tecniseven-catalogo.firebaseapp.com",
            databaseURL: "https://tecniseven-catalogo-default-rtdb.firebaseio.com",
            projectId: "tecniseven-catalogo",
            storageBucket: "tecniseven-catalogo.firebasestorage.app",
            messagingSenderId: "916685844409",
            appId: "1:916685844409:web:d4192b1560cffddfd35068",
            measurementId: "G-CFHET0V9YL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const productosRef = ref(db, 'productos');

        let productos = [];
        let ordenInvertido = false;

        // Escuchar cambios en la nube en tiempo real
        onValue(productosRef, (snapshot) => {
            const data = snapshot.val();
            productos = [];
            if (data) {
                Object.keys(data).forEach(key => {
                    productos.push({ id: key, ...data[key] });
                });
            }
            renderizar();
        });

        window.guardarProductoNube = (producto) => {
            set(ref(db, 'productos/' + producto.id), producto);
        };

        window.eliminarProductoNube = (id) => {
            remove(ref(db, 'productos/' + id));
        };

        window.renderizar = () => {
            const filtro = (document.getElementById('buscador')?.value || '').toLowerCase();
            
            let listaFiltrada = productos.filter(p => 
                (p.nombre || '').toLowerCase().includes(filtro) || 
                (p.sku || '').toLowerCase().includes(filtro) || 
                (p.categoria || '').toLowerCase().includes(filtro)
            );

            listaFiltrada.sort((a, b) => {
                const numA = parseInt(((a.nombre || '').match(/\d+/) || [0])[0]);
                const numB = parseInt(((b.nombre || '').match(/\d+/) || [0])[0]);
                if (numA !== numB) return numA - numB;
                return (a.nombre || '').localeCompare(b.nombre || '', 'es');
            });

            if (ordenInvertido) listaFiltrada.reverse();

            const contador = document.getElementById('contador-productos');
            if (contador) contador.innerText = listaFiltrada.length;

            const tbody = document.getElementById('tabla-productos');
            if (!tbody) return;
            tbody.innerHTML = '';

            if (listaFiltrada.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-500">No hay productos en la nube. ¡Agrega uno o importa un Excel/CSV!</td></tr>`;
                return;
            }

            listaFiltrada.forEach((p) => {
                const final = Number(p.base || 0) * (1 + (Number(p.margen || 0) / 100));

                let optionsHTML = '';
                const categoriasDisponibles = ['Portátiles', 'Monitores', 'Periféricos', 'Componentes', 'Tarjetas Gráficas', 'Accesorios'];
                categoriasDisponibles.forEach(cat => {
                    const selected = (p.categoria === cat) ? 'selected' : '';
                    optionsHTML += `<option value="${cat}" ${selected} class="bg-slate-900 text-slate-100">${cat}</option>`;
                });

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-800/40 transition group';
                tr.innerHTML = `
                    <td class="p-4 font-mono font-medium" style="color: #2323ff;">${p.sku || ''}</td>
                    <td class="p-4">
                        <input type="text" value="${p.nombre || ''}" onchange="actualizarDato('${p.id}', 'nombre', this.value)" class="bg-transparent border-b border-transparent hover:border-slate-700 w-full text-white py-1 transition">
                    </td>
                    <td class="p-4">
                        <select onchange="actualizarDato('${p.id}', 'categoria', this.value)" class="bg-slate-900 border border-slate-800 rounded px-2 py-1.5 text-slate-300">
                            ${optionsHTML}
                        </select>
                    </td>
                    <td class="p-4">
                        <div class="relative flex items-center">
                            <span class="absolute left-2 text-slate-400">$</span>
                            <input type="number" step="0.01" value="${p.base || 0}" onchange="actualizarBase('${p.id}', this.value)" class="bg-slate-900 border border-slate-800 rounded pl-7 pr-3 py-1.5 w-32 text-white font-mono">
                        </div>
                    </td>
                    <td class="p-4">
                        <div class="relative flex items-center">
                            <input type="number" step="0.1" value="${p.margen || 0}" onchange="actualizarMargen('${p.id}', this.value)" id="margen-input-${p.id}" class="bg-slate-900 border border-slate-800 rounded pl-3 pr-7 py-1.5 w-24 text-white font-mono">
                            <span class="text-slate-500 absolute right-3">%</span>
                        </div>
                    </td>
                    <td class="p-4">
                        <div class="relative flex items-center">
                            <span class="absolute left-2 font-bold" style="color: #2323ff;">$</span>
                            <input type="number" step="0.01" value="${final.toFixed(2)}" onchange="actualizarPrecioFinal('${p.id}', this.value)" id="final-input-${p.id}" class="input-precio-final rounded pl-7 pr-3 py-1.5 w-32 font-mono font-bold neon-glow">
                        </div>
                    </td>
                    <td class="p-4 text-center">
                        <button onclick="eliminarProducto('${p.id}')" class="text-slate-600 hover:text-rose-400 transition p-1 cursor-pointer" title="Eliminar producto">
                            ✕
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        };

        window.actualizarDato = (id, campo, valor) => {
            const prod = productos.find(p => String(p.id) === String(id));
            if (prod) {
                prod[campo] = valor;
                window.guardarProductoNube(prod);
            }
        };

        window.actualizarBase = (id, valor) => {
            const prod = productos.find(p => String(p.id) === String(id));
            if (prod) {
                prod.base = parseFloat(valor) || 0;
                window.guardarProductoNube(prod);
            }
        };

        window.actualizarMargen = (id, valor) => {
            const prod = productos.find(p => String(p.id) === String(id));
            if (prod) {
                prod.margen = parseFloat(valor) || 0;
                window.guardarProductoNube(prod);
            }
        };

        window.actualizarPrecioFinal = (id, valor) => {
            const finalVal = parseFloat(valor);
            const prod = productos.find(p => String(p.id) === String(id));
            if (prod && !isNaN(finalVal) && prod.base > 0) {
                prod.margen = parseFloat((((finalVal / prod.base) - 1) * 100).toFixed(2));
                window.guardarProductoNube(prod);
            }
        };

        window.agregarProducto = () => {
            const nuevoId = 'prod_' + Date.now();
            const nuevoProd = {
                id: nuevoId,
                sku: `TEC-${Math.floor(100 + Math.random() * 900)}`,
                nombre: 'Nuevo Producto TECNISEVEN',
                categoria: 'Tarjetas Gráficas',
                base: 500.00,
                margen: 20
            };
            window.guardarProductoNube(nuevoProd);
        };

        window.eliminarProducto = (id) => {
            if (confirm('¿Deseas eliminar este producto de la nube?')) {
                window.eliminarProductoNube(id);
            }
        };

        window.cambiarOrden = () => {
            ordenInvertido = !ordenInvertido;
            window.renderizar();
        };

        // --- AUTOMATIZACIÓN: EXPORTAR A CSV (EXCEL) ---
        window.exportarCSV = () => {
            if (productos.length === 0) {
                alert("No hay productos para exportar.");
                return;
            }
            let csvContent = "data:text/csv;charset=utf-8,SKU,Nombre,Categoria,PrecioBase,Margen\n";
            productos.forEach(p => {
                let fila = `"${p.sku || ''}","${p.nombre || ''}","${p.categoria || ''}",${p.base || 0},${p.margen || 0}`;
                csvContent += fila + "\n";
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "catalogo_tecniseven.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // --- AUTOMATIZACIÓN: IMPORTAR DESDE CSV (EXCEL) ---
        window.importarCSV = (event) => {
            const archivo = event.target.files[0];
            if (!archivo) return;

            const lector = new FileReader();
            lector.onload = function(e) {
                const contenido = e.target.result;
                const lineas = contenido.split("\n");
                let contadorImportados = 0;

                // Empezamos desde i = 1 para saltar la cabecera
                for (let i = 1; i < lineas.length; i++) {
                    const linea = lineas[i].trim();
                    if (!linea) continue;

                    // Separar por comas respetando comillas simples o dobles básicas
                    const columnas = linea.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || linea.split(',');
                    if (columnas.length >= 5) {
                        const sku = columnas[0].replace(/"/g, '').trim();
                        const nombre = columnas[1].replace(/"/g, '').trim();
                        const categoria = columnas[2].replace(/"/g, '').trim();
                        const base = parseFloat(columnas[3]) || 0;
                        const margen = parseFloat(columnas[4]) || 0;

                        const id = 'prod_' + Date.now() + '_' + i;
                        const productoNuevo = { id, sku, nombre, categoria, base, margen };
                        
                        // Guardar directo en Firebase
                        window.guardarProductoNube(productoNuevo);
                        contadorImportados++;
                    }
                }
                alert(`¡Se han importado ${contadorImportados} productos a la nube con éxito!`);
                event.target.value = ''; // Limpiar input
            };
            lector.readAsText(archivo);
        };
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 font-sans">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 border-b border-slate-800 pb-6">
            <div>
                <div class="flex items-center gap-3">
                    <span class="bg-[#2323ff]/15 border border-[#2323ff]/40 p-2.5 rounded-xl text-[#2323ff] text-2xl neon-glow">⚡</span>
                    <h1 class="text-3xl font-extrabold tracking-tight text-white">
                        TECNISEVEN <span style="color: #2323ff;" class="font-light">| Catálogo Nube</span>
                    </h1>
                </div>
                <p class="text-slate-400 mt-2">Sincronización en tiempo real con automatización de archivos Excel/CSV.</p>
            </div>
            
            <!-- Botones de Acción -->
            <div class="flex flex-wrap gap-3">
                <button onclick="exportarCSV()" class="bg-slate-900 border border-slate-700 hover:border-[#2323ff] text-slate-200 px-4 py-2.5 rounded-lg font-medium transition flex items-center gap-2 cursor-pointer">
                    📥 Exportar Excel
                </button>
                
                <label class="bg-slate-900 border border-slate-700 hover:border-[#2323ff] text-slate-200 px-4 py-2.5 rounded-lg font-medium transition flex items-center gap-2 cursor-pointer">
                    📤 Importar Excel
                    <input type="file" accept=".csv" onchange="importarCSV(event)" class="hidden">
                </label>

                <button onclick="agregarProducto()" style="background-color: #2323ff;" class="hover:bg-blue-700 text-white px-4 py-2.5 rounded-lg font-bold transition flex items-center gap-2 shadow-lg neon-glow cursor-pointer">
                    + Nuevo Producto
                </button>
            </div>
        </div>

        <!-- Buscador -->
        <div class="mb-6 flex flex-col md:flex-row gap-4 items-center justify-between bg-slate-900/40 p-4 rounded-2xl border border-slate-800">
            <div class="relative w-full md:w-96">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">🔍</span>
                <input type="text" id="buscador" oninput="renderizar()" placeholder="Buscar en la nube por producto, SKU..." class="bg-slate-900 border border-slate-800 rounded-lg pl-10 pr-4 py-2 w-full text-white text-sm focus:border-[#2323ff]">
            </div>
            <div class="text-slate-400 text-sm">
                Mostrando <span id="contador-productos" class="text-cyan-400 font-bold">0</span> productos en la nube
            </div>
        </div>

        <!-- Tabla -->
        <div class="bg-slate-900/60 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl backdrop-blur-md">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-900/90 uppercase text-xs tracking-wider border-b border-slate-800" style="color: #2323ff;">
                            <th class="p-4">SKU</th>
                            <th class="p-4 cursor-pointer hover:text-white" onclick="cambiarOrden()">Producto / Calidad ↕</th>
                            <th class="p-4">Categoría</th>
                            <th class="p-4">Precio Base ($)</th>
                            <th class="p-4">Margen Ind. (%)</th>
                            <th class="p-4">Precio Final ($)</th>
                            <th class="p-4 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-productos" class="divide-y divide-slate-800/60 text-sm">
                        <!-- Carga dinámica desde la nube -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
