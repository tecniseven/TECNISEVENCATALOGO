<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECNISEVEN - Catálogo Nube</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCYTZrTBFxhwr0Pz9v7oFXNQLKJJPsA7H4",
            authDomain: "tecniseven-catalogo.firebaseapp.com",
            databaseURL: "https://tecniseven-catalogo-default-rtdb.firebaseio.com",
            projectId: "tecniseven-catalogo",
            storageBucket: "tecniseven-catalogo.firebasestorage.app",
            messagingSenderId: "916685844409",
            appId: "1:916685844409:web:d4192b1560cffddfd35068",
            measurementId: "G-CFHET0V9YL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const productosRef = ref(db, 'productos');
        let productos = [];

        onValue(productosRef, (snapshot) => {
            const data = snapshot.val();
            productos = [];
            if (data) {
                Object.keys(data).forEach(key => {
                    productos.push({ id: key, ...data[key] });
                });
            }
            renderizar();
        });

        window.guardarProductoNube = (p) => set(ref(db, 'productos/' + p.id), p);
        window.eliminarProductoNube = (id) => remove(ref(db, 'productos/' + id));

        window.renderizar = () => {
            const filtro = (document.getElementById('buscador')?.value || '').toLowerCase();
            let lista = productos.filter(p => (p.nombre || '').toLowerCase().includes(filtro) || (p.sku || '').toLowerCase().includes(filtro));
            
            document.getElementById('contador-productos').innerText = lista.length;
            const tbody = document.getElementById('tabla-productos');
            tbody.innerHTML = '';

            if (lista.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-500">No hay productos. ¡Agrega uno nuevo!</td></tr>`;
                return;
            }

            lista.forEach(p => {
                const final = Number(p.base || 0) * (1 + (Number(p.margen || 0) / 100));
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-800/40 border-b border-slate-800';
                tr.innerHTML = `
                    <td class="p-4 font-mono text-blue-500">${p.sku || ''}</td>
                    <td class="p-4"><input type="text" value="${p.nombre || ''}" onchange="actualizar('${p.id}', 'nombre', this.value)" class="bg-transparent text-white w-full"></td>
                    <td class="p-4"><input type="text" value="${p.categoria || ''}" onchange="actualizar('${p.id}', 'categoria', this.value)" class="bg-transparent text-white w-32"></td>
                    <td class="p-4"><input type="number" step="0.01" value="${p.base || 0}" onchange="actualizar('${p.id}', 'base', parseFloat(this.value))" class="bg-slate-900 border border-slate-800 rounded p-1 w-24 text-white"></td>
                    <td class="p-4"><input type="number" step="0.1" value="${p.margen || 0}" onchange="actualizar('${p.id}', 'margen', parseFloat(this.value))" class="bg-slate-900 border border-slate-800 rounded p-1 w-20 text-white"></td>
                    <td class="p-4 font-bold text-blue-400">$${final.toFixed(2)}</td>
                    <td class="p-4 text-center"><button onclick="eliminar('${p.id}')" class="text-rose-500 font-bold">✕</button></td>
                `;
                tbody.appendChild(tr);
            });
        };

        window.actualizar = (id, campo, valor) => {
            let p = productos.find(x => x.id === id);
            if(p) { p[campo] = valor; window.guardarProductoNube(p); }
        };

        window.agregarProducto = () => {
            window.guardarProductoNube({
                id: 'prod_' + Date.now(),
                sku: `TEC-${Math.floor(100 + Math.random() * 900)}`,
                nombre: 'Nuevo Producto',
                categoria: 'General',
                base: 100,
                margen: 20
            });
        };

        window.eliminar = (id) => { if(confirm('¿Eliminar producto?')) window.eliminarProductoNube(id); };

        window.exportarCSV = () => {
            if (productos.length === 0) return alert("No hay productos.");
            let csv = "SKU,Nombre,Categoria,Base,Margen\n";
            productos.forEach(p => csv += `"${p.sku}","${p.nombre}","${p.categoria}",${p.base},${p.margen}\n`);
            let link = document.createElement("a");
            link.href = encodeURI("data:text/csv;charset=utf-8," + csv);
            link.download = "catalogo.csv";
            link.click();
        };

        window.importarCSV = (e) => {
            let file = e.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(evt) {
                let lineas = evt.target.result.split("\n");
                for (let i = 1; i < lineas.length; i++) {
                    let cols = lineas[i].split(',');
                    if (cols.length >= 5) {
                        window.guardarProductoNube({
                            id: 'prod_' + Date.now() + '_' + i,
                            sku: cols[0].replace(/"/g, '').trim(),
                            nombre: cols[1].replace(/"/g, '').trim(),
                            categoria: cols[2].replace(/"/g, '').trim(),
                            base: parseFloat(cols[3]) || 0,
                            margen: parseFloat(cols[4]) || 0
                        });
                    }
                }
                alert("¡Importación completa!");
            };
            reader.readAsText(file);
        };
    </script>
</head>
<body class="bg-slate-950 text-slate-100 p-6 font-sans">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-bold">⚡ TECNISEVEN <span class="text-blue-500 font-light">| Catálogo Nube</span></h1>
            <div class="flex gap-2">
                <button onclick="exportarCSV()" class="bg-slate-900 border border-slate-700 px-3 py-2 rounded text-sm">📥 Exportar CSV</button>
                <label class="bg-slate-900 border border-slate-700 px-3 py-2 rounded text-sm cursor-pointer">📤 Importar CSV <input type="file" accept=".csv" onchange="importarCSV(event)" class="hidden"></label>
                <button onclick="agregarProducto()" class="bg-blue-600 px-4 py-2 rounded text-sm font-bold">+ Producto</button>
            </div>
        </div>
        <div class="mb-4 flex justify-between items-center bg-slate-900 p-3 rounded border border-slate-800">
            <input type="text" id="buscador" oninput="renderizar()" placeholder="Buscar..." class="bg-slate-950 border border-slate-800 rounded p-2 text-sm w-80 text-white">
            <span class="text-sm text-slate-400">Total: <span id="contador-productos" class="text-blue-400 font-bold">0</span></span>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded overflow-hidden">
            <table class="w-full text-left text-sm">
                <thead class="bg-slate-950 text-blue-500 border-b border-slate-800">
                    <tr><th class="p-3">SKU</th><th class="p-3">Producto</th><th class="p-3">Categoría</th><th class="p-3">Base ($)</th><th class="p-3">Margen (%)</th><th class="p-3">Final ($)</th><th class="p-3 text-center">Acción</th></tr>
                </thead>
                <tbody id="tabla-productos"></tbody>
            </table>
        </div>
    </div>
</body>
</html>
