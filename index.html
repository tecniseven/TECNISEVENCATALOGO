<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECNISEVEN - Catálogo en la Nube</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .neon-glow {
            box-shadow: 0 0 15px rgba(35, 35, 255, 0.4);
        }
        input:focus, select:focus {
            border-color: #2323ff !important;
            box-shadow: 0 0 10px rgba(35, 35, 255, 0.4);
            outline: none;
        }
        .input-precio-final {
            background-color: #0b0b1a !important;
            color: #ffffff !important;
            border: 2px solid #2323ff !important;
        }
    </style>

    <!-- Módulos de Firebase Realtime Database -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCYTZrTBFxhwr0Pz9v7oFXNQLKJJPsA7H4",
            authDomain: "tecniseven-catalogo.firebaseapp.com",
            databaseURL: "https://tecniseven-catalogo-default-rtdb.firebaseio.com",
            projectId: "tecniseven-catalogo",
            storageBucket: "tecniseven-catalogo.firebasestorage.app",
            messagingSenderId: "916685844409",
            appId: "1:916685844409:web:d4192b1560cffddfd35068",
            measurementId: "G-CFHET0V9YL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const productosRef = ref(db, 'productos');

        let productos = [];
        let ordenInvertido = false;

        onValue(productosRef, (snapshot) => {
            const data = snapshot.val();
            productos = [];
            if (data) {
                Object.keys(data).forEach(key => {
                    productos.push({ id: key, ...data[key] });
                });
            }
            renderizar();
        });

        window.guardarProductoNube = (producto) => {
            set(ref(db, 'productos/' + producto.id), producto);
        };

        window.eliminarProductoNube = (id) => {
            remove(ref(db, 'productos/' + id));
        };

        const obtenerFechaActual = () => {
            const ahora = new Date();
            return ahora.toLocaleDateString() + ' ' + ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        };

        window.renderizar = () => {
            const filtro = (document.getElementById('buscador')?.value || '').toLowerCase();
            
            let listaFiltrada = productos.filter(p => 
                (p.nombre || '').toLowerCase().includes(filtro) || 
                (p.sku || '').toLowerCase().includes(filtro) || 
                (p.categoria || '').toLowerCase().includes(filtro)
            );

            listaFiltrada.sort((a, b) => {
                const numA = parseInt(((a.nombre || '').match(/\d+/) || [0])[0]);
                const numB = parseInt(((b.nombre || '').match(/\d+/) || [0])[0]);
                if (numA !== numB) return numA - numB;
                return (a.nombre || '').localeCompare(b.nombre || '', 'es');
            });

            if (ordenInvertido) listaFiltrada.reverse();

            const contador = document.getElementById('contador-productos');
            if (contador) contador.innerText = listaFiltrada.length;

            const tbody = document.getElementById('tabla-productos');
            if (!tbody) return;
            tbody.innerHTML = '';

            if (listaFiltrada.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-500 font-medium text-sm sm:text-base">No hay productos en la nube. ¡Agrega uno nuevo o importa un archivo Excel!</td></tr>`;
                return;
            }

            listaFiltrada.forEach((p) => {
                const final = Number(p.base || 0) * (1 + (Number(p.margen || 0) / 100));
                const ultimaMod = p.ultimaModificacion ? `<span class="block text-[11px] text-cyan-400/80 mt-1 font-mono">🕒 Actualizado: ${p.ultimaModificacion}</span>` : `<span class="block text-[11px] text-slate-500 mt-1 font-mono">🕒 Sin cambios</span>`;

                let optionsHTML = '';
                const categoriasDisponibles = ['Portátiles', 'Monitores', 'Periféricos', 'Componentes', 'Tarjetas Gráficas', 'Accesorios', 'General'];
                categoriasDisponibles.forEach(cat => {
                    const selected = (p.categoria === cat) ? 'selected' : '';
                    optionsHTML += `<option value="${cat}" ${selected} class="bg-slate-900 text-slate-100">${cat}</option>`;
                });

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-800/40 transition group border-b border-slate-800/60';
                tr.innerHTML = `
                    <td class="p-3 sm:p-4 font-mono font-medium text-sm sm:text-base whitespace-nowrap" style="color: #2323ff;">${p.sku || ''}</td>
                    <td class="p-3 sm:p-4 min-w-[200px]">
                        <input type="text" value="${p.nombre || ''}" onchange="actualizarDato('${p.id}', 'nombre', this.value)" class="bg-transparent border-b border-transparent hover:border-slate-700 w-full text-white py-1 transition font-medium text-sm sm:text-base">
                        ${ultimaMod}
                    </td>
                    <td class="p-3 sm:p-4 whitespace-nowrap">
                        <select onchange="actualizarDato('${p.id}', 'categoria', this.value)" class="bg-slate-900 border border-slate-800 rounded px-2.5 py-1.5 text-slate-200 text-sm sm:text-base">
                            ${optionsHTML}
                        </select>
                    </td>
                    <td class="p-3 sm:p-4 whitespace-nowrap">
                        <div class="relative flex items-center">
                            <span class="absolute left-2.5 text-slate-400 font-mono text-sm">$</span>
                            <input type="number" step="0.01" value="${p.base || 0}" onchange="actualizarBase('${p.id}', this.value)" class="bg-slate-900 border border-slate-800 rounded pl-7 pr-3 py-1.5 w-28 sm:w-36 text-white font-mono text-sm sm:text-base">
                        </div>
                    </td>
                    <td class="p-3 sm:p-4 whitespace-nowrap">
                        <div class="relative flex items-center">
                            <input type="number" step="0.1" value="${p.margen || 0}" onchange="actualizarMargen('${p.id}', this.value)" class="bg-slate-900 border border-slate-800 rounded pl-3 pr-7 py-1.5 w-20 sm:w-28 text-white font-mono text-sm sm:text-base">
                            <span class="text-slate-500 absolute right-2.5 text-sm">%</span>
                        </div>
                    </td>
                    <td class="p-3 sm:p-4 whitespace-nowrap">
                        <div class="relative flex items-center">
                            <span class="absolute left-2.5 font-bold text-sm" style="color: #2323ff;">$</span>
                            <input type="number" step="0.01" value="${final.toFixed(2)}" onchange="actualizarPrecioFinal('${p.id}', this.value)" class="input-precio-final rounded pl-7 pr-3 py-1.5 w-28 sm:w-36 font-mono font-bold text-sm sm:text-base neon-glow">
                        </div>
                    </td>
                    <td class="p-3 sm:p-4 text-center whitespace-nowrap">
                        <button onclick="eliminarProducto('${p.id}')" class="text-slate-500 hover:text-rose-400 transition p-2 cursor-pointer text-base sm:text-lg" title="Eliminar producto">
                            ✕
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        };

        window.actualizarDato = (id, campo, valor) => {
            const prod = productos.find(p => String(p.id) === String(id));
            if (prod) {
                prod[campo] = valor;
                prod.ultimaModificacion = obtenerFechaActual();
                window.guardarProductoNube(prod);
            }
        };

        window.actualizarBase = (id, valor) => {
            const prod = productos.find(p => String(p.id) === String(id));
            if (prod) {
                prod.base = parseFloat(valor) || 0;
                prod.ultimaModificacion = obtenerFechaActual();
                window.guardarProductoNube(prod);
            }
        };

        window.actualizarMargen = (id, valor) => {
            const prod = productos.find(p => String(p.id) === String(id));
            if (prod) {
                prod.margen = parseFloat(valor) || 0;
                prod.ultimaModificacion = obtenerFechaActual();
                window.guardarProductoNube(prod);
            }
        };

        window.actualizarPrecioFinal = (id, valor) => {
            const finalVal = parseFloat(valor);
            const prod = productos.find(p => String(p.id) === String(id));
            if (prod && !isNaN(finalVal) && prod.base > 0) {
                prod.margen = parseFloat((((finalVal / prod.base) - 1) * 100).toFixed(2));
                prod.ultimaModificacion = obtenerFechaActual();
                window.guardarProductoNube(prod);
            }
        };

        window.agregarProducto = () => {
            const nuevoId = 'prod_' + Date.now();
            const nuevoProd = {
                id: nuevoId,
                sku: `TEC-${Math.floor(100 + Math.random() * 900)}`,
                nombre: 'Nuevo Producto TECNISEVEN',
                categoria: 'General',
                base: 100.00,
                margen: 20,
                ultimaModificacion: obtenerFechaActual()
            };
            window.guardarProductoNube(nuevoProd);
        };

        window.eliminarProducto = (id) => {
            if (confirm('¿Deseas eliminar este producto de la nube?')) {
                window.eliminarProductoNube(id);
            }
        };

        window.cambiarOrden = () => {
            ordenInvertido = !ordenInvertido;
            window.renderizar();
        };

        window.exportarCSV = () => {
            if (productos.length === 0) {
                alert("No hay productos para exportar.");
                return;
            }
            let csvContent = "data:text/csv;charset=utf-8,SKU,Nombre,Categoria,PrecioBase,Margen,UltimaModificacion\n";
            productos.forEach(p => {
                let fila = `"${p.sku || ''}","${p.nombre || ''}","${p.categoria || ''}",${p.base || 0},${p.margen || 0},"${p.ultimaModificacion || ''}"`;
                csvContent += fila + "\n";
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "catalogo_tecniseven.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        window.importarCSV = (event) => {
            const archivo = event.target.files[0];
            if (!archivo) return;

            const lector = new FileReader();
            lector.onload = function(e) {
                const contenido = e.target.result;
                let lineas = contenido.split("\n");
                let contadorImportados = 0;

                for (let i = 1; i < lineas.length; i++) {
                    let linea = lineas[i].trim();
                    if (!linea) continue;

                    let columnas = linea.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || linea.split(',');
                    if (columnas.length >= 5) {
                        let sku = columnas[0].replace(/"/g, '').trim();
                        let nombre = columnas[1].replace(/"/g, '').trim();
                        let categoria = columnas[2].replace(/"/g, '').trim();
                        let base = parseFloat(columnas[3]) || 0;
                        let margen = parseFloat(columnas[4]) || 0;

                        let id = 'prod_' + Date.now() + '_' + i;
                        let productoNuevo = { 
                            id, 
                            sku, 
                            nombre, 
                            categoria, 
                            base, 
                            margen, 
                            ultimaModificacion: obtenerFechaActual() 
                        };
                        
                        window.guardarProductoNube(productoNuevo);
                        contadorImportados++;
                    }
                }
                alert(`¡Se han importado ${contadorImportados} productos a la nube con éxito!`);
                event.target.value = '';
            };
            lector.readAsText(archivo);
        };
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-3 sm:p-6 font-sans">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 sm:mb-8 gap-4 border-b border-slate-800 pb-6">
            <div class="flex items-center gap-3 sm:gap-4 w-full md:w-auto">
                <img src="Logo.png" alt="Logo TECNISEVEN" class="h-16 sm:h-20 w-auto object-contain rounded-2xl bg-slate-900 border border-[#2323ff]/40 p-2 neon-glow" onerror="this.onerror=null; this.src='logo.png';">
                <div>
                    <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">
                        TECNISEVEN <span style="color: #2323ff;" class="font-light">| Catálogo Nube</span>
                    </h1>
                    <p class="text-slate-400 mt-1 text-xs sm:text-base">Control avanzado de precios, sincronización y seguimiento de fluctuaciones.</p>
                </div>
            </div>
            
            <!-- Botones de Acción -->
            <div class="flex flex-wrap gap-2 sm:gap-3 w-full md:w-auto">
                <button onclick="exportarCSV()" class="flex-1 sm:flex-none bg-slate-900 border border-slate-700 hover:border-[#2323ff] text-slate-200 px-3 sm:px-4 py-2.5 rounded-lg font-medium transition flex items-center justify-center gap-2 cursor-pointer text-sm sm:text-base shadow-md">
                    📥 Exportar Excel
                </button>
                
                <label class="flex-1 sm:flex-none bg-slate-900 border border-slate-700 hover:border-[#2323ff] text-slate-200 px-3 sm:px-4 py-2.5 rounded-lg font-medium transition flex items-center justify-center gap-2 cursor-pointer text-sm sm:text-base shadow-md">
                    📤 Importar Excel
                    <input type="file" accept=".csv" onchange="importarCSV(event)" class="hidden">
                </label>

                <button onclick="agregarProducto()" style="background-color: #2323ff;" class="w-full sm:w-auto hover:bg-blue-700 text-white px-4 py-2.5 rounded-lg font-bold transition flex items-center justify-center gap-2 shadow-lg neon-glow cursor-pointer text-sm sm:text-base">
                    + Nuevo Producto
                </button>
            </div>
        </div>

        <!-- Buscador -->
        <div class="mb-6 flex flex-col sm:flex-row gap-3 sm:gap-4 items-center justify-between bg-slate-900/40 p-3 sm:p-4 rounded-2xl border border-slate-800 backdrop-blur-md">
            <div class="relative w-full sm:w-96">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 text-base">🔍</span>
                <input type="text" id="buscador" oninput="renderizar()" placeholder="Buscar por producto, SKU..." class="bg-slate-900 border border-slate-800 rounded-lg pl-10 pr-4 py-2.5 w-full text-white text-sm sm:text-base focus:border-[#2323ff]">
            </div>
            <div class="text-slate-300 text-sm sm:text-base text-right w-full sm:w-auto">
                Mostrando <span id="contador-productos" class="text-cyan-400 font-bold">0</span> productos activos
            </div>
        </div>

        <!-- Tabla -->
        <div class="bg-slate-900/60 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl backdrop-blur-md">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-900/90 uppercase text-[11px] sm:text-xs tracking-wider border-b border-slate-800" style="color: #2323ff;">
                            <th class="p-3 sm:p-4">SKU</th>
                            <th class="p-3 sm:p-4 cursor-pointer hover:text-white transition" onclick="cambiarOrden()">Producto / Modelo ↕</th>
                            <th class="p-3 sm:p-4">Categoría</th>
                            <th class="p-3 sm:p-4">Precio Base ($)</th>
                            <th class="p-3 sm:p-4">Margen (%)</th>
                            <th class="p-3 sm:p-4">Precio Final ($)</th>
                            <th class="p-3 sm:p-4 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-productos" class="divide-y divide-slate-800/60 text-sm sm:text-base">
                        <!-- Carga dinámica -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
