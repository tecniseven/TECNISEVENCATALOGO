<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECNISEVEN - Catálogo en la Nube</title>
    
    <!-- FUENTES MODERNAS Y LEGIBLES -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- LIBRERÍA EXCEL (SheetJS) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- FAVICON -->
    <link rel="icon" type="image/jpeg" href="favicon.jpeg?v=30" id="favicon-link">
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const img = new Image();
            img.src = 'favicon.jpeg';
            img.onerror = () => {
                const fav = document.getElementById('favicon-link');
                if (fav) fav.href = 'Logo.png';
            };
        });
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            overflow-x: hidden;
        }

        .cyber-title {
            font-family: 'Orbitron', sans-serif;
        }

        .cyber-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: 
                radial-gradient(circle at 20% 30%, rgba(35, 35, 255, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.2) 0%, transparent 40%),
                linear-gradient(to right, rgba(35, 35, 255, 0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 50px 50px, 50px 50px;
        }

        .watermark-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            opacity: 0.12;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4rem;
            padding: 4rem;
        }
        .wm-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 7rem;
            font-weight: 900;
            color: #3b82f6;
            text-transform: uppercase;
            letter-spacing: -2px;
            transform: rotate(-15deg);
            white-space: nowrap;
        }
        .wm-number {
            font-size: 22rem;
            font-weight: 900;
            color: #00ffff;
            transform: rotate(10deg);
            line-height: 0.8;
            text-shadow: 0 0 30px rgba(0,255,255,0.5);
        }

        .neon-glow {
            box-shadow: 0 0 20px rgba(35, 35, 255, 0.5);
        }
        .neon-glow-strong {
            box-shadow: 0 0 40px rgba(35, 35, 255, 0.9), inset 0 0 20px rgba(35, 35, 255, 0.6);
        }
        input:focus, select:focus, textarea:focus {
            border-color: #00ffff !important;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
            outline: none;
        }
        .input-precio-final {
            background-color: #050511 !important;
            color: #00ffff !important;
            border: 2px solid #2323ff !important;
        }
        .bar-container {
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.7), 0 0 50px rgba(35, 35, 255, 0.8);
        }
        .cat-btn-active {
            background-color: #2323ff !important;
            color: #ffffff !important;
            border-color: #00ffff !important;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
        }
    </style>

    <!-- Módulos de Firebase Realtime Database -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCYTZrTBFxhwr0Pz9v7oFXNQLKJJPsA7H4",
            authDomain: "tecniseven-catalogo.firebaseapp.com",
            databaseURL: "https://tecniseven-catalogo-default-rtdb.firebaseio.com",
            projectId: "tecniseven-catalogo",
            storageBucket: "tecniseven-catalogo.firebasestorage.app",
            messagingSenderId: "916685844409",
            appId: "1:916685844409:web:d4192b1560cffddfd35068",
            measurementId: "G-CFHET0V9YL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const productosRef = ref(db, 'productos');

        let productos = [];
        let productosTemporales = [];
        let categoriaFiltroSeleccionada = 'TODOS';
        let isUserTyping = false;

        const USUARIO_CORRECTO = "tecniseven";
        const PASS_CORRECTA = "iCloud480.";

        window.verificarSesionLocal = () => {
            const sesion = localStorage.getItem('tecniseven_logged');
            const loginScreen = document.getElementById('login-screen');
            const appContainer = document.getElementById('app-container');
            const loadingScreen = document.getElementById('loading-screen');

            if (sesion === 'true') {
                if (loginScreen) loginScreen.classList.add('hidden');
                if (appContainer) appContainer.classList.remove('hidden');
            } else {
                if (loginScreen) loginScreen.classList.remove('hidden');
                if (appContainer) appContainer.classList.add('hidden');
                if (loadingScreen) loadingScreen.style.display = 'none';
            }
        };

        window.iniciarSesion = (event) => {
            event.preventDefault();
            const user = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            const errorMsg = document.getElementById('login-error');

            if (user === USUARIO_CORRECTO && pass === PASS_CORRECTA) {
                localStorage.setItem('tecniseven_logged', 'true');
                errorMsg.classList.add('hidden');
                window.verificarSesionLocal();
            } else {
                errorMsg.innerText = "Usuario o contraseña incorrectos.";
                errorMsg.classList.remove('hidden');
            }
        };

        window.cerrarSesion = () => {
            localStorage.removeItem('tecniseven_logged');
            document.getElementById('login-pass').value = '';
            document.getElementById('login-user').value = '';
            window.verificarSesionLocal();
        };

        window.ocultarLoader = () => {
            const loader = document.getElementById('loading-screen');
            if (loader && loader.style.display !== 'none') {
                loader.style.opacity = '0';
                loader.style.transition = 'opacity 0.4s ease';
                setTimeout(() => loader.style.display = 'none', 400);
            }
        };

        setTimeout(window.ocultarLoader, 2500);

        onValue(productosRef, (snapshot) => {
            const data = snapshot.val();
            productos = [];
            if (data) {
                Object.keys(data).forEach(key => {
                    let p = data[key];
                    if (p.categoria === "Refrigeración") {
                        p.categoria = "Fan Coolers / Refr. Líquida";
                    }
                    if (p.final === undefined && p.base !== undefined) {
                        const m = Number(p.margen !== undefined ? p.margen : 20);
                        p.final = Number(p.base) * (1 + (m / 100));
                    }
                    productos.push({ id: key, ...p });
                });
            }
            if (!isUserTyping) {
                renderizar();
            }
            window.ocultarLoader();
        });

        window.guardarProductoNube = (producto) => {
            set(ref(db, 'productos/' + producto.id), producto);
        };

        window.eliminarProductoNube = (id) => {
            remove(ref(db, 'productos/' + id));
        };

        const obtenerFechaActual = () => {
            const ahora = new Date();
            return ahora.toLocaleDateString() + ' ' + ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        };

        window.filtrarPorCategoria = (cat) => {
            categoriaFiltroSeleccionada = cat;
            
            const botones = document.querySelectorAll('.btn-cat-filter');
            botones.forEach(btn => {
                if (btn.getAttribute('data-cat') === cat) {
                    btn.classList.add('cat-btn-active');
                    btn.classList.remove('bg-slate-900/90', 'text-slate-300');
                } else {
                    btn.classList.remove('cat-btn-active');
                    btn.classList.add('bg-slate-900/90', 'text-slate-300');
                }
            });

            renderizar();
        };

        window.renderizar = () => {
            if (isUserTyping) return;

            const filtroBuscador = (document.getElementById('buscador')?.value || '').toLowerCase();
            
            let listaFiltrada = productos.filter(p => {
                const coincideTexto = (p.nombre || '').toLowerCase().includes(filtroBuscador) || 
                                     (p.sku || '').toLowerCase().includes(filtroBuscador) || 
                                     (p.categoria || '').toLowerCase().includes(filtroBuscador) ||
                                     (p.descripcion || '').toLowerCase().includes(filtroBuscador);

                const coincideCategoria = (categoriaFiltroSeleccionada === 'TODOS') || (p.categoria === categoriaFiltroSeleccionada);

                return coincideTexto && coincideCategoria;
            });

            listaFiltrada.sort((a, b) => (a.sku || '').localeCompare(b.sku || ''));

            const contador = document.getElementById('contador-productos');
            if (contador) contador.innerText = listaFiltrada.length;

            const container = document.getElementById('lista-productos');
            if (!container) return;
            container.innerHTML = '';

            if (listaFiltrada.length === 0) {
                container.innerHTML = `<div class="p-10 text-center text-slate-400 font-medium text-sm bg-slate-900/80 rounded-2xl border border-slate-700 backdrop-blur-md">No hay productos en la categoría seleccionada o que coincidan con la búsqueda.</div>`;
                return;
            }

            listaFiltrada.forEach((p) => {
                const baseVal = Number(p.base || 0);
                const finalVal = Number(p.final || (baseVal * 1.20));
                
                let margenCalculado = 0;
                if (baseVal > 0 && finalVal > 0) {
                    margenCalculado = (((finalVal / baseVal) - 1) * 100).toFixed(1);
                }

                const ultimaMod = p.ultimaModificacion ? `<span class="text-[11px] text-cyan-400 font-mono">🕒 Actualizado: ${p.ultimaModificacion}</span>` : `<span class="text-[11px] text-slate-400 font-mono">🕒 Sin cambios</span>`;

                let optionsHTML = '';
                const categoriasDisponibles = ['Procesadores', 'Tarjetas Gráficas', 'Placas Madre', 'Memorias RAM', 'Fuentes de Poder', 'Fan Coolers / Refr. Líquida', 'Cases', 'Almacenamiento', 'Monitores', 'Portátiles', 'Periféricos', 'Accesorios', 'General'];
                categoriasDisponibles.forEach(cat => {
                    const selected = (p.categoria === cat) ? 'selected' : '';
                    optionsHTML += `<option value="${cat}" ${selected} class="bg-slate-900 text-slate-100">${cat}</option>`;
                });

                const card = document.createElement('div');
                card.className = 'bg-slate-900/90 border border-slate-700/80 hover:border-cyan-500 transition rounded-2xl p-5 mb-4 shadow-2xl backdrop-blur-xl relative z-10';
                card.innerHTML = `
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-3 pb-3 border-b border-slate-800">
                        <div class="flex items-center gap-3 w-full sm:w-auto">
                            <span class="font-mono text-xs font-bold px-3 py-1 rounded-lg bg-[#2323ff]/20 text-cyan-300 border border-[#2323ff]/50">${p.sku || ''}</span>
                            <div class="w-full sm:w-96">
                                <input type="text" value="${p.nombre || ''}" 
                                    onfocus="isUserTyping = true" 
                                    onblur="isUserTyping = false; actualizarDato('${p.id}', 'nombre', this.value)" 
                                    class="bg-slate-950/90 border border-slate-700 rounded-lg px-3 py-2 w-full text-white text-sm font-semibold focus:border-cyan-400" placeholder="Nombre del producto">
                            </div>
                        </div>
                        <div class="flex items-center justify-between w-full sm:w-auto gap-4">
                            ${ultimaMod}
                            <button onclick="eliminarProducto('${p.id}')" class="text-slate-400 hover:text-rose-400 transition p-2 cursor-pointer text-xs font-bold bg-slate-950 rounded-lg border border-slate-800 px-3">✕ Eliminar</button>
                        </div>
                    </div>

                    <!-- Fila de Descripción Corta -->
                    <div class="mb-4">
                        <input type="text" value="${p.descripcion || ''}" 
                            onfocus="isUserTyping = true" 
                            onblur="isUserTyping = false; actualizarDato('${p.id}', 'descripcion', this.value)" 
                            class="bg-slate-950/70 border border-slate-800 rounded-lg px-3 py-2 w-full text-slate-200 text-xs focus:border-cyan-400" placeholder="Descripción corta o especificaciones clave...">
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 items-center">
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="text-[11px] font-medium text-slate-300 block">CATEGORÍA</label>
                                <span class="text-[10px] font-mono bg-cyan-950 text-cyan-300 px-1.5 py-0.5 rounded border border-cyan-800/60">📊 Ganancia: +${margenCalculado}%</span>
                            </div>
                            <select onchange="actualizarDato('${p.id}', 'categoria', this.value)" class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 text-xs w-full font-medium">
                                ${optionsHTML}
                            </select>
                        </div>

                        <div>
                            <label class="text-[11px] font-medium text-slate-300 block mb-1">PRECIO BASE ($)</label>
                            <div class="relative flex items-center">
                                <span class="absolute left-3 text-cyan-400 font-mono">$</span>
                                <input type="number" step="0.01" value="${baseVal}" 
                                    onfocus="isUserTyping = true" 
                                    onblur="isUserTyping = false; actualizarBase('${p.id}', this.value)" 
                                    class="bg-slate-950 border border-slate-700 rounded-lg pl-8 pr-3 py-2 w-full text-white font-mono text-xs font-bold">
                            </div>
                        </div>

                        <div>
                            <label class="text-[11px] font-bold text-cyan-400 block mb-1">PRECIO DE VENTA ($)</label>
                            <div class="relative flex items-center">
                                <span class="absolute left-3 font-bold text-cyan-300">$</span>
                                <input type="number" step="0.01" value="${finalVal.toFixed(2)}" 
                                    onfocus="isUserTyping = true" 
                                    onblur="isUserTyping = false; actualizarPrecioFinal('${p.id}', this.value)" 
                                    class="input-precio-final rounded-lg pl-8 pr-3 py-2 w-full font-mono font-bold text-xs neon-glow">
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        };

        window.actualizarDato = (id, campo, valor) => {
            const prod = productos.find(p => String(p.id) === String(id));
            if (prod && prod[campo] !== valor) {
                prod[campo] = valor;
                prod.ultimaModificacion = obtenerFechaActual();
                window.guardarProductoNube(prod);
            }
        };

        window.actualizarBase = (id, valor) => {
            const prod = productos.find(p => String(p.id) === String(id));
            if (prod) {
                prod.base = parseFloat(valor) || 0;
                prod.ultimaModificacion = obtenerFechaActual();
                window.guardarProductoNube(prod);
            }
        };

        window.actualizarPrecioFinal = (id, valor) => {
            const prod = productos.find(p => String(p.id) === String(id));
            if (prod) {
                prod.final = parseFloat(valor) || 0;
                prod.ultimaModificacion = obtenerFechaActual();
                window.guardarProductoNube(prod);
            }
        };

        window.agregarProducto = () => {
            const nuevoId = 'prod_' + Date.now();
            const nuevoProd = {
                id: nuevoId,
                sku: `TEC-${Math.floor(100 + Math.random() * 900)}`,
                nombre: 'Nuevo Producto TECNISEVEN',
                descripcion: 'Especificaciones clave',
                categoria: 'General',
                base: 100.00,
                final: 120.00,
                ultimaModificacion: obtenerFechaActual()
            };
            window.guardarProductoNube(nuevoProd);
        };

        window.eliminarProducto = (id) => {
            if (confirm('¿Deseas eliminar este producto de la nube?')) {
                window.eliminarProductoNube(id);
            }
        };

        window.exportarExcel = () => {
            if (productos.length === 0) {
                alert("No hay productos para exportar.");
                return;
            }

            const datosExportar = productos.map(p => {
                const base = Number(p.base || 0);
                const venta = Number(p.final || (base * 1.20));
                let gananciaPct = base > 0 ? (((venta / base) - 1) * 100).toFixed(1) + '%' : '0%';

                return {
                    "SKU": p.sku || '',
                    "Nombre del Producto": p.nombre || '',
                    "Descripción / Especificaciones": p.descripcion || '',
                    "Categoría": p.categoria || 'General',
                    "Precio Base ($)": base,
                    "Precio de Venta ($)": venta,
                    "Ganancia Est. (%)": gananciaPct,
                    "Última Modificación": p.ultimaModificacion || 'N/D'
                };
            });

            const worksheet = XLSX.utils.json_to_sheet(datosExportar);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Catálogo TECNISEVEN");

            const colWidths = [
                {wch: 12}, {wch: 30}, {wch: 35}, {wch: 18}, {wch: 15}, {wch: 18}, {wch: 16}, {wch: 20}
            ];
            worksheet['!cols'] = colWidths;

            XLSX.writeFile(workbook, "Catalogo_Tecniseven.xlsx");
        };

        window.toggleModalImportacion = (mostrar) => {
            const modal = document.getElementById('modal-importar');
            if (modal) {
                if (mostrar) {
                    modal.classList.remove('hidden');
                    document.getElementById('step-input').classList.remove('hidden');
                    document.getElementById('step-preview').classList.add('hidden');
                    const savedKey = localStorage.getItem('gemini_api_key');
                    if (savedKey) document.getElementById('gemini-api-key').value = savedKey;
                } else {
                    modal.classList.add('hidden');
                }
            }
        };

        window.analizarConIA = async () => {
            const texto = document.getElementById('texto-pegado').value.trim();
            const apiKey = document.getElementById('gemini-api-key').value.trim();

            if (!apiKey) {
                alert("Por favor ingresa tu API Key de Gemini.");
                return;
            }
            if (!texto) {
                alert("Por favor pega los datos del proveedor en el cuadro de texto.");
                return;
            }
